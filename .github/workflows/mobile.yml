name: .NET MAUI - CI

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "Design/**"
      - "Assets/**"
      - "docs/**"
  pull_request:
    branches:
      - "main"
      - "*"
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "Design/**"
      - "Assets/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "microsoft"

jobs:
  # ============================================================================
  # Quality Gate: Clean Architecture & SOLID Principles Verification
  # ============================================================================
  # The inner layers (Domain, Core, Infrastructure) and Unit Tests are pure .NET
  # with no UI/platform dependencies. Testing them first on a fast Linux runner
  # adheres to the Single Responsibility Principle and the Fail-Fast CI pattern,
  # preventing expensive mobile runner minutes if core business rules fail.
  # ============================================================================
  Quality_Gate_Tests:
    name: "Clean Architecture & Tests Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Clean Architecture Layers & Test Dependencies
        run: |
          dotnet restore Meow.Infrastructure/Meow.Infrastructure.csproj
          dotnet restore Meow.Tests/Meow.Tests.csproj

      - name: Build Clean Architecture Layers (Domain, Core, Infrastructure)
        run: |
          dotnet build Meow.Domain/Meow.Domain.csproj -c Release --no-restore
          dotnet build Meow.Core/Meow.Core.csproj -c Release --no-restore
          dotnet build Meow.Infrastructure/Meow.Infrastructure.csproj -c Release --no-restore

      - name: Run Unit Tests (158 Tests across Domain, Core, ViewModels & Controls)
        run: dotnet test Meow.Tests/Meow.Tests.csproj -c Release --no-restore --verbosity normal

  # ============================================================================
  # Presentation Layer: Android App Build
  # ============================================================================
  Build_Android:
    name: "Build Android App (.NET 10 MAUI)"
    needs: [Quality_Gate_Tests]
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java ${{ env.JAVA_VERSION }} (${{ env.JAVA_DISTRIBUTION }})
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Restore NuGet Packages
        run: dotnet restore Meow/Meow.csproj -p:UseSharedCompilation=false

      - name: Build Android App (Release)
        run: dotnet build Meow/Meow.csproj -f net10.0-android -c Release -p:UseSharedCompilation=false

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-app-release
          path: |
            Meow/bin/Release/net10.0-android/*-Signed.apk
            Meow/bin/Release/net10.0-android/*.apk
            Meow/bin/Release/net10.0-android/*.aab
          if-no-files-found: warn
          retention-days: 7

  # ============================================================================
  # Presentation Layer: iOS App Build
  # ============================================================================
  Build_iOS:
    name: "Build iOS App (.NET 10 MAUI)"
    needs: [Quality_Gate_Tests]
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install .NET MAUI iOS Workload
        run: dotnet workload install maui-ios

      - name: Restore NuGet Packages
        run: dotnet restore Meow/Meow.csproj

      - name: Build iOS App (Release)
        run: dotnet build Meow/Meow.csproj -f net10.0-ios -c Release /p:CreatePackage=false

  # ============================================================================
  # Presentation Layer: MacCatalyst App Build
  # ============================================================================
  Build_MacCatalyst:
    name: "Build MacCatalyst App (.NET 10 MAUI)"
    needs: [Quality_Gate_Tests]
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install .NET MAUI MacCatalyst Workload
        run: dotnet workload install maui-maccatalyst

      - name: Restore NuGet Packages
        run: dotnet restore Meow/Meow.csproj

      - name: Build MacCatalyst App (Release)
        run: dotnet build Meow/Meow.csproj -f net10.0-maccatalyst -c Release /p:CreatePackage=false

  # ============================================================================
  # Presentation Layer: Windows App Build
  # ============================================================================
  Build_Windows:
    name: "Build Windows App (.NET 10 MAUI)"
    needs: [Quality_Gate_Tests]
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install .NET MAUI Windows Workload
        run: dotnet workload install maui-windows

      - name: Restore NuGet Packages
        run: dotnet restore Meow/Meow.csproj

      - name: Build Windows App (Release)
        run: dotnet build Meow/Meow.csproj -f net10.0-windows10.0.19041.0 -c Release
