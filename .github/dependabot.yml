# Dependabot configuration for .NET MAUI & Clean Architecture solution
version: 2
updates:
  # Monitor NuGet packages across the Clean Architecture solution (Domain, Core, Infrastructure, Presentation, Tests)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Monitor GitHub Actions workflow versions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5